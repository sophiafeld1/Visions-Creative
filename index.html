<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visions Creative LLC designs, builds, and launches websites for businesses.">
  <title>Visions Creative LLC | Websites for businesses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..650;1,400..650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=76">
</head>
<body>
  <header class="site-header">
    <nav class="nav wrap">
      <a href="#" class="nav-logo">Visions Creative</a>
      <ul class="nav-links">
        <li><a href="#projects">Projects</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="https://www.linkedin.com/in/sophia-feldman/" target="_blank" rel="noopener">LinkedIn</a></li>
      </ul>
      <a class="btn btn-primary nav-cta" id="nav-book-chat" href="#" target="_blank" rel="noopener">Book a call</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <p class="hero-kicker" id="hero-kicker">Design, engineering, and delivery</p>
          <h1 class="hero-title" id="hero-headline"></h1>
          <p class="hero-subtitle"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" id="hero-book-chat" href="#" target="_blank" rel="noopener">Book a call</a>
            <a class="btn btn-line" href="#projects">See projects</a>
          </div>
        </div>
        <div class="hero-stage" aria-hidden="true">
          <span class="jump jump-1"></span>
          <span class="jump jump-2"></span>
          <span class="jump jump-3"></span>
          <span class="jump jump-4"></span>
          <div class="jump jump-mini">
            <div class="layout-chrome">
              <span></span><span></span><span></span>
            </div>
            <div class="jump-mini-body"></div>
          </div>
          <div class="layout-browser" id="layout-browser">
            <div class="layout-chrome">
              <span></span><span></span><span></span>
              <i></i>
            </div>
            <div class="layout-slot layout-nav">
              <b></b><b></b><b></b>
            </div>
            <div class="layout-slot layout-hero"></div>
            <div class="layout-slot layout-card-a">
              <span></span><i></i><i></i>
            </div>
            <div class="layout-slot layout-card-b">
              <span></span><i></i><i></i>
            </div>
            <div class="layout-slot layout-btn"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="projects" class="section section-projects">
      <h2 class="visually-hidden" id="work-title">Projects</h2>
      <p class="section-desc" id="work-desc"></p>
      <div class="wrap">
        <div id="project-grid" class="project-grid"></div>
      </div>
    </section>

    <div id="work-detail-view" class="work-detail-view" hidden></div>

    <section id="about" class="section section-about">
      <div class="wrap about-grid">
        <div class="about-carousel" id="about-carousel" data-reveal>
          <div class="about-carousel-track" id="about-carousel-track"></div>
          <nav class="about-carousel-dots" id="about-carousel-dots" aria-label="Studio photos"></nav>
        </div>
        <div class="about-content" data-reveal>
          <h2 class="section-title" id="about-title">About</h2>
          <p class="about-text"></p>
        </div>
      </div>
    </section>

    <section id="contact" class="section section-contact">
      <div class="wrap">
        <div class="contact-box" data-reveal>
          <h2 class="section-title" id="contact-title">Contact</h2>
          <p class="section-desc" id="contact-desc"></p>
          <div class="contact-links" id="contact-links"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="preview-modal" class="preview-modal" hidden aria-hidden="true">
    <div class="preview-modal-backdrop" data-close-modal></div>
    <div class="preview-modal-dialog" role="dialog" aria-modal="true" aria-label="Project preview">
      <button type="button" class="preview-modal-close" aria-label="Close preview">&times;</button>
      <div class="preview-modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> <span data-name>Visions Creative LLC</span></p>
  </footer>

  <script src="js/projects.js?v=51"></script>
  <script src="js/main.js?v=68"></script>
</body>
</html>
