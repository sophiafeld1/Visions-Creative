<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visions Creative LLC designs, builds, and launches websites for businesses.">
  <title>Visions Creative LLC — Websites for businesses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=67">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <div class="nav-brand">
        <a href="#" class="nav-logo" data-name>Visions Creative LLC</a>
      </div>
      <ul class="nav-links">
        <li><a href="#work">Work</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="https://www.linkedin.com/in/sophia-feldman/" target="_blank" rel="noopener">LinkedIn</a></li>
      </ul>
      <a class="nav-cta btn btn-primary" id="nav-book-chat" href="#" target="_blank" rel="noopener">Book a call</a>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero">
      <h1 class="hero-title" id="hero-headline"></h1>
      <div class="hero-copy">
        <span class="hero-rule" aria-hidden="true"></span>
        <p class="hero-subtitle"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" id="hero-book-chat" href="#" target="_blank" rel="noopener">Book a call</a>
        </div>
      </div>
    </section>

    <section id="work" class="section section-work">
      <h2 class="visually-hidden" id="work-title">Work</h2>
      <p class="section-desc" id="work-desc"></p>
      <div id="project-grid" class="project-grid"></div>
    </section>

    <div id="work-detail-view" class="work-detail-view" hidden></div>

    <section id="about" class="section section-alt">
      <div class="about-inner">
        <div class="about-layout">
          <div class="about-carousel" id="about-carousel">
            <div class="about-carousel-track" id="about-carousel-track"></div>
            <nav class="about-carousel-dots" id="about-carousel-dots" aria-label="Studio photos"></nav>
          </div>
          <div class="about-content">
            <h2 class="section-title" id="about-title">About</h2>
            <p class="about-text"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="contact" class="section section-alt">
      <h2 class="section-title" id="contact-title">Contact</h2>
      <p class="section-desc" id="contact-desc"></p>
      <div class="contact-links" id="contact-links"></div>
    </section>
  </main>

  <div id="preview-modal" class="preview-modal" hidden aria-hidden="true">
    <div class="preview-modal-backdrop" data-close-modal></div>
    <div class="preview-modal-dialog" role="dialog" aria-modal="true" aria-label="Project preview">
      <button type="button" class="preview-modal-close" aria-label="Close preview">&times;</button>
      <div class="preview-modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> <span data-name>Visions Creative LLC</span></p>
  </footer>

  <script src="js/projects.js?v=49"></script>
  <script src="js/main.js?v=62"></script>
</body>
</html>
